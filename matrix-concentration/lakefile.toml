name = "matrix_concentration"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MatrixConcentration"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "SLT"
git = "https://github.com/mlexpos/lean-stat-learning-theory"
rev = "141d5210706b556840e31c7fefce07788af0e771"

[[lean_lib]]
name = "MatrixConcentration"
