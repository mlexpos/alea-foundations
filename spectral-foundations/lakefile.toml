name = "spectral_foundations"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SpectralFoundations"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "SpectralFoundations"
